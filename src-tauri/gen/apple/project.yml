name: locally-uncensored
options:
  bundleIdPrefix: com.purpledoubled.lu
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: LU
      PRODUCT_BUNDLE_IDENTIFIER: com.purpledoubled.lu
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  locally-uncensored_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: locally-uncensored_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: locally-uncensored_iOS/Info.plist
      properties:
        # Der Name unter dem Symbol, ausdruecklich. Ohne den Schluessel nimmt
        # iOS CFBundleName; das ergab auch "LU", stand aber nirgends fest.
        CFBundleDisplayName: LU
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 3.0.10
        CFBundleVersion: "30010001"
    entitlements:
      path: locally-uncensored_iOS/locally-uncensored_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # Nur iPhone (1). Die erste Veroeffentlichung meldet das iPad nicht an:
        # mit "1,2" prueft Apple auch dort und verlangt iPad-Screenshots.
        # Umkehrbar: "1,2" eintragen, das Projekt neu schreiben (BAUEN.md 5.7),
        # die Pruefung in scripts/mobile/ios/pruefe-paket.sh mitziehen.
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        # Nur der Geraete-Bau bekommt das Entitlement fuer mehr Speicher. Es
        # braucht ein Profil, der Simulator-Bau laeuft ohne Signatur.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": locally-uncensored_iOS/LU-Geraet.entitlements
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
    # Was nur der Rechner meint, kommt aus der Info.plist des Pakets heraus
    # (scripts/mobile/ios/plist-nur-handy.sh). Nach dem Verarbeiten der
    # Info.plist, vor der Signatur.
    postBuildScripts:
      - script: sh "${SRCROOT}/../../../scripts/mobile/ios/plist-nur-handy.sh" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        name: Keep phone texts only
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)