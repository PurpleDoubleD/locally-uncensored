name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # release.yml calls this same workflow as its gate, so the release is held to
  # exactly the checks master is held to — one definition, no drift between
  # "what CI runs" and "what a release had to pass".
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to check out. Empty (push/pull_request) keeps actions/checkout's
          default, which is the commit that triggered the run. release.yml passes the
          release tag, so the gate reads the same bytes the installer is built from.
        required: false
        type: string
        default: ''

# Third-party actions are pinned to a full commit SHA (not a moving tag) so a
# compromised or retagged upstream release can't silently run in our CI with
# secrets in scope. The trailing comment records the human-readable version.
# To bump: resolve the new tag to its SHA (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).
jobs:
  lint-and-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Historical debt: the repo carries ~170 files of pre-existing lint
      # errors (unused test vars, no-explicit-any in old suites) that predate
      # 2.5.7 — lint has been red since April. Keep it visible but non-gating
      # until the debt is paid down; tsc + vitest + build are the real gates.
      - name: Lint (non-gating — pre-existing debt)
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The harness stubs the Tauri IPC in-page (e2e/support/tauri-mock.ts) —
      # no Rust sidecar, Ollama or ComfyUI processes needed.
      - name: Playwright e2e (Tauri-mocked)
        run: npm run test:e2e

  cargo-check:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Empty on push/pull_request (checkout falls back to the triggering
          # commit); the release tag when release.yml calls this workflow.
          ref: ${{ inputs.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      # tauri-build's copy_binaries HARD-FAILS from build.rs when a declared
      # externalBin file is missing — cargo check needs the sidecar file to
      # EXIST, not to work. Stub it so the check doesn't pay a 20-min llama
      # build; the real binaries are built in release.yml + sidecar-windows.yml.
      #
      # The same empty file is enough for `cargo test` and `cargo clippy`: they
      # run the identical build.rs, and no test executes the sidecar. The few
      # tests that need a live inference server are already #[ignore]d for
      # exactly that reason (see commands/remote.rs, commands/install.rs).
      - name: Stub llama-server sidecar for cargo check
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          case "$triple" in
            *-windows-*) touch "src-tauri/bin/lu-llama-server-$triple.exe" ;;
            *)           touch "src-tauri/bin/lu-llama-server-$triple" ;;
          esac
          ls -la src-tauri/bin/

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      # 539 Rust tests lived in the tree while CI only ever type-checked them.
      # They are unit tests over pure logic and short-lived child processes —
      # the whole suite runs in seconds once the crate is built, so there is no
      # cost argument for leaving them out.
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      # Non-gating for now, on purpose. Today's baseline (stable 1.95) is ~65
      # warnings plus ONE deny-by-default error: `absurd_extreme_comparisons`
      # at src/commands/secret.rs:108, where MAX_UNITS is usize::MAX on every
      # non-Windows target, so `count() <= MAX_UNITS` is always true. That
      # single line makes `cargo clippy` exit non-zero on the ubuntu lane even
      # WITHOUT -D warnings, so gating it here would turn CI red on arrival for
      # a debt this job did not create. Keep the list visible, pay it down, then
      # drop continue-on-error and add `-- -D warnings`.
      - name: Clippy (non-gating — pre-existing debt)
        working-directory: src-tauri
        run: cargo clippy --all-targets
        continue-on-error: true
