name: A40 probe, real model load on macOS 14 and 15 (temporary)

# TEMPORARY, A40 (GH #259). Runs only on pushes to the A40 branch and is
# reverted on that branch once its runs are read. Not meant for master.
#
# For each runner and each variant (with and without LU patch 0005):
# build the sidecar with build-llama.sh, run the embedded shader check, load
# a real model with -ngl 999 and generate a few tokens, and load it again on
# the processor with --device none (and, without the patch, with the old
# -ngl 0 fallback). The job is green when every outcome matches what the
# report claims; the outcomes are printed either way.
on:
  push:
    branches: [claude/a40-metal-macos15-51acd0]

permissions:
  contents: read

env:
  # Qwen's own repository, Apache-2.0. Revision and sha256 read from the
  # Hugging Face API of that repository on 2026-11-18.
  MODEL_URL: 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf'
  MODEL_SHA256: '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is no longer offered by GitHub ("configuration not supported").
        runner: [macos-15]
        patch: [with, without]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build the sidecar (${{ matrix.patch }} patch 0005)
        shell: bash
        env:
          BUILD_JOBS: 3
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          set -euo pipefail
          sw_vers
          patches="$RUNNER_TEMP/patches"
          cp -R scripts/llama-patches "$patches"
          if [ "${{ matrix.patch }}" = without ]; then rm "$patches/0005-metal-unary-bf16-no-constexpr.patch"; fi
          ls "$patches"
          LLAMA_LU_PATCH_DIR="$patches" bash scripts/build-llama.sh aarch64-apple-darwin

      - name: Probe
        shell: bash
        run: |
          # GitHub runs `bash -e`; this probe reports every outcome, so no early exit.
          set +e
          set -u
          bin="$PWD/src-tauri/bin/lu-llama-server-aarch64-apple-darwin"
          echo "unary cast in the binary: constexpr=$(strings "$bin" | grep -c 'inline constexpr bfloat4 ggml_metal_unary_cast') plain=$(strings "$bin" | grep -c 'inline bfloat4 ggml_metal_unary_cast')"

          if bash scripts/check-metal-shaders.sh ".llama-build/build-aarch64-apple-darwin/ggml/src/ggml-metal/autogenerated" > "$RUNNER_TEMP/check.log" 2>&1; then check=pass; else check=fail; fi
          grep -v '^ok ' "$RUNNER_TEMP/check.log" | head -30

          mkdir -p "$RUNNER_TEMP/model"
          model="$RUNNER_TEMP/model/qwen.gguf"
          curl -fsSL --retry 3 --max-time 600 -o "$model" "$MODEL_URL"
          echo "$MODEL_SHA256  $model" | shasum -a 256 -c - || { echo "FAIL: model sha256 mismatch"; exit 1; }

          # load <label> <args...>: pass when /health comes up and a completion
          # returns tokens, fail when the server dies or never serves.
          load() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/$label.log"
            "$bin" -m "$model" --host 127.0.0.1 --port 18930 --ctx-size 2048 -np 1 -lv 4 "$@" >"$log" 2>&1 &
            local pid=$! ok=""
            for _ in $(seq 1 240); do
              if curl -fsS http://127.0.0.1:18930/health >/dev/null 2>&1; then ok=1; break; fi
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            local result=fail
            if [ -n "$ok" ]; then
              local out
              out="$(curl -s --max-time 120 http://127.0.0.1:18930/completion -H 'Content-Type: application/json' \
                -d '{"prompt":"The capital of France is","n_predict":16,"temperature":0}')"
              if python3 -I -c 'import sys,json; d=json.loads(sys.argv[1]); t=d["timings"]; assert d["content"].strip(); print("  text:", repr(d["content"][:80])); print("  tokens/s: %.1f" % t["predicted_per_second"])' "$out"; then result=pass; fi
            fi
            kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
            echo "  metal init lines: $(grep -c 'ggml_metal_init' "$log"), metal library error: $(grep -c 'failed to initialize the Metal library' "$log"), has bfloat: $(grep -m1 'has bfloat' "$log" | awk -F= '{print $2}' | tr -d ' '), GPU: $(grep -m1 'GPU name' "$log" | sed 's/.*GPU name: *//'), offloaded: $(grep -m1 -o 'offloaded [0-9]*/[0-9]* layers to GPU' "$log")"
            [ "$result" = pass ] || grep -E 'error|Error' "$log" | head -8
            eval "res_$label=$result"
            echo "$label: $result"
          }
          load gpu -ngl 999
          load cpu_device_none -ngl 0 --device none
          load cpu_ngl0 -ngl 0

          bf16="$(grep -m1 'has bfloat' "$RUNNER_TEMP/gpu.log" | awk -F= '{print $2}' | tr -d ' ')"
          echo "== ${{ matrix.runner }} / ${{ matrix.patch }}: shader check=$check, gpu=$res_gpu, cpu --device none=$res_cpu_device_none, cpu -ngl 0=$res_cpu_ngl0, device has bfloat=$bf16"

          bad=0
          if [ "${{ matrix.patch }}" = with ]; then
            [ "$check" = pass ] || { echo "UNEXPECTED: shader check failed with the patch"; bad=1; }
            [ "$res_gpu" = pass ] || { echo "UNEXPECTED: -ngl 999 load failed with the patch"; bad=1; }
          else
            [ "$check" = fail ] || { echo "UNEXPECTED: shader check passed without the patch"; bad=1; }
            if [ "$bf16" = true ]; then
              [ "$res_gpu" = fail ] || { echo "UNEXPECTED: -ngl 999 loaded without the patch on a bfloat device"; bad=1; }
              [ "$res_cpu_ngl0" = fail ] || { echo "UNEXPECTED: the old -ngl 0 fallback survived without the patch"; bad=1; }
            else
              echo "NOTE: this runner's GPU reports no bfloat, so the unpatched shader branch is not compiled at load time here; the shader check above forces it."
            fi
          fi
          [ "$res_cpu_device_none" = pass ] || { echo "UNEXPECTED: --device none did not serve"; bad=1; }
          exit "$bad"
